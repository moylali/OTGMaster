# Promotes the latest release on the internal track to production.
# Trigger manually: gh workflow run promote.yml -f version_code=47
# or via GitHub UI: Actions → Promote to Production → Run workflow.

name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode expected on the internal track (refuses to promote anything else)"
        required: true

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Promote internal → production
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          EXPECTED_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          pip install google-auth requests --quiet

          python3 - <<'PYEOF'
          import json, os, requests
          import google.auth.transport.requests
          import google.oauth2.service_account as sa

          KEY = json.loads(os.environ["SERVICE_ACCOUNT_JSON"])
          PACKAGE = "app.fayaz.otgmaster"
          SCOPES = ["https://www.googleapis.com/auth/androidpublisher"]
          BASE = "https://androidpublisher.googleapis.com/androidpublisher/v3/applications"

          creds = sa.Credentials.from_service_account_info(KEY, scopes=SCOPES)
          creds.refresh(google.auth.transport.requests.Request())
          token = creds.token
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          # 1. Open edit
          r = requests.post(f"{BASE}/{PACKAGE}/edits", headers=headers)
          r.raise_for_status()
          edit_id = r.json()["id"]
          print(f"Edit: {edit_id}")

          # 2. Get internal track releases
          r = requests.get(f"{BASE}/{PACKAGE}/edits/{edit_id}/tracks/internal", headers=headers)
          r.raise_for_status()
          internal = r.json()
          releases = internal.get("releases", [])
          completed = [rel for rel in releases if rel.get("status") == "completed"]
          if not completed:
              raise SystemExit("No completed release found on internal track")
          release = completed[0]
          expected = os.environ["EXPECTED_VERSION_CODE"].strip()
          if expected not in [str(v) for v in release["versionCodes"]]:
              raise SystemExit(f"Internal track holds {release['versionCodes']}, not {expected}; nothing promoted")
          notes = release.get("releaseNotes", [])
          print(f"Promoting versionCodes {release['versionCodes']} ({release.get('name','')}), "
                f"release notes in {[n.get('language') for n in notes]}")

          # 3. Update production track. The release notes and name are carried over:
          # without them the production release had no "What's new" at all, although
          # release.yml had uploaded them (distribution/whatsnew) with the internal one.
          prod_release = {"versionCodes": release["versionCodes"], "status": "completed"}
          if notes:
              prod_release["releaseNotes"] = notes
          if release.get("name"):
              prod_release["name"] = release["name"]
          prod_body = {"releases": [prod_release]}
          r = requests.put(f"{BASE}/{PACKAGE}/edits/{edit_id}/tracks/production",
                           headers=headers, json=prod_body)
          r.raise_for_status()
          print("Production track updated")

          # 4. Commit
          r = requests.post(f"{BASE}/{PACKAGE}/edits/{edit_id}:commit", headers=headers)
          r.raise_for_status()
          print("Edit committed — promotion complete")
          PYEOF
